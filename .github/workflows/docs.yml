name: Documentation

on:
  push:
    branches: [ "master" ]
    paths: [ "docs/**", "src/**", "README.md", ".github/workflows/docs.yml" ]
  pull_request:
    branches: [ "master" ]
    paths: [ "docs/**", "src/**", ".github/workflows/docs.yml" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Restore tools
      run: dotnet tool restore

    - name: Build the documentation
      run: dotnet docfx docs/docfx.json --warningsAsErrors

    - name: Upload the site
      if: github.event_name != 'pull_request'
      uses: actions/upload-pages-artifact@v3
      with:
        path: docs/_site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
