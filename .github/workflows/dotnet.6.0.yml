name: .NET build & test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Restore dependencies
      run: dotnet restore src/TinyCsv.sln

    - name: Build
      run: dotnet build --no-restore src/TinyCsv.sln

    - name: Test
      run: dotnet test --no-build src/TinyCsv.sln
